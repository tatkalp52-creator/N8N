<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Оживление</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/konva/9.3.6/konva.min.js"></script>
<style>
  /* (29.10) Приложение разметки оживления в боте. Холст — библиотека Konva (как в редакторах: тянуть, растягивать,
     поворачивать, масштаб колесом и двумя пальцами). Код знает только геометрию эффекта (точка, овал, обводка,
     путь, рамка); какие эффекты есть, их названия, подсказки, ручки и слова строк — из листа «Эффекты». */
  :root { --bg: #f6f3ee; --ink: #2b2620; --mute: #786e62; --line: #d9d0c3; --mark: #e11d48; --acc: #2563eb; --card: #fffdf9; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1d1a17; --ink: #ece6dc; --mute: #a69b8d; --line: #3a342d; --card: #26221e; } }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.35 -apple-system, system-ui, sans-serif; overflow: hidden; }
  #app { display: flex; flex-direction: column; height: 100%; }
  #tools { display: flex; gap: 6px; overflow-x: auto; padding: 8px; border-bottom: 1px solid var(--line); flex: none; }
  #tools button, .btn { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 18px; padding: 7px 12px; font: inherit; white-space: nowrap; cursor: pointer; }
  #tools button.on, .btn.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  #stage { position: relative; flex: 1 1 auto; overflow: hidden; touch-action: none; background: #000; }
  /* высоты подсказки и панели постоянные: новая отметка не сжимает картинку и не сдвигает её */
  #hint { flex: none; padding: 6px 10px; color: var(--mute); font-size: 13px; border-top: 1px solid var(--line); height: 3.6em; overflow: auto; }
  #panel { flex: none; height: 28vh; overflow: auto; border-top: 1px solid var(--line); padding: 6px 8px 10px; }
  .mk { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 6px 8px; margin: 6px 0; }
  .mk.sel { border-color: var(--acc); }
  .mk .row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .mk .name { font-weight: 600; flex: 1; cursor: pointer; }
  .mk label { font-size: 13px; color: var(--mute); display: inline-flex; align-items: center; gap: 4px; margin: 3px 8px 0 0; }
  .mk label .kb { padding: 3px 10px; border-radius: 8px; min-width: 2.2em; }
  .mk input[type=text] { width: 100%; padding: 4px; font: inherit; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); margin-top: 4px; }
  .mk code { font-size: 12px; color: var(--mute); word-break: break-all; display: block; margin-top: 4px; }
  #bar { flex: none; display: flex; gap: 6px; padding: 8px; border-top: 1px solid var(--line); }
  #bar .btn { flex: 1; }
  #msg { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%); background: var(--ink); color: var(--bg); padding: 12px 16px; border-radius: 12px; display: none; max-width: 86vw; text-align: center; z-index: 9; }
</style>
</head>
<body>
<div id="app">
  <div id="tools"></div>
  <div id="stage"></div>
  <div id="hint"></div>
  <div id="panel"></div>
  <div id="bar">
    <button class="btn" id="bPan">✋ Двигать</button>
    <button class="btn" id="bDone">Готово</button>
    <button class="btn" id="bUndo">↶</button>
    <button class="btn" id="bClose">✕ Закрыть</button>
  </div>
</div>
<div id="msg"></div>
<script>
(function () {
  var tg = window.Telegram && Telegram.WebApp; if (tg) { tg.ready(); tg.expand(); }
  var Q = new URLSearchParams(location.search);
  var PROJECT = Q.get('p') || '', CHANNEL = Q.get('ch') || '', IMG = Q.get('img') || '', SUBMIT = Q.get('submit') || '';
  var $ = function (id) { return document.getElementById(id); };
  function say(t, ms) { var m = $('msg'); m.textContent = t; m.style.display = 'block'; clearTimeout(say.t); say.t = setTimeout(function () { m.style.display = 'none'; }, ms || 2200); }
  function r1(v) { return Math.round(v * 10) / 10; }
  function f(v) { return String(r1(v)); }
  $('bClose').onclick = function () { if (tg) tg.close(); else window.close(); };
  if (!window.Konva) { say('Не загрузилась библиотека холста — проверьте интернет и откройте ещё раз', 8000); return; }

  // ── Геометрия по механике (это механика, не содержание): как ставится разметка ──
  var GEOM = { steam_cup: 'oval', blink: 'oval', smoke: 'point', candle: 'point', bubbles: 'two', lights: 'points',
    steam_surface: 'area', rain: 'area', stars: 'area', fire: 'area', behind: 'area', edge: 'line', leaves: 'path', cover: 'frame' };
  var FRAME_H = 864;   // овал — в пикселях кадра высотой 864 (так его читает сборщик)
  var RED = '#e11d48', BLUE = '#2563eb';

  var CAT = [], WORDS = {}, cur = null, marks = [], sel = -1, pending = null, pan = false;

  // Слова строк — из листа: слово эффекта — из колонки «Строка для сборщика», ручки — из «Ручки»,
  // слова частей (область, овал, наклон, кадр, справа…) — из словарика («Слово» → «Значит»)
  function lead(t) { return String(t || '').split(':')[0].trim(); }
  function wordFor(val) { var w = WORDS[val]; return w ? w.replace(/\*$/, '') : ''; }
  // значение ручки у канала — из колонки канала листа «Эффекты» («густота 5 · толщина 7»); нет — 5 (середина шкалы)
  function chanVal(e, k) {
    var hit = String(e.value || '').split('·').map(function (s) { return s.trim(); }).filter(function (s) { return s.indexOf(k + ' ') === 0; })[0];
    return hit ? hit.slice(k.length).trim() : '5';
  }
  function knobNames(txt) {
    var out = [];
    String(txt || '').split(';').forEach(function (seg) {
      seg = seg.trim(); if (!seg || /^—|^ручек нет/.test(seg)) return;
      var head = seg.split(' — ')[0];
      head.split(',').forEach(function (k) { k = k.replace(/\(.*\)/, '').trim(); if (k && k.split(' ').length <= 2) out.push(k); });
    });
    return out;
  }

  // ── Холст ──
  var box = $('stage');
  var stage = new Konva.Stage({ container: 'stage', width: box.clientWidth, height: box.clientHeight });
  var layer = new Konva.Layer(); stage.add(layer);
  var picNode = new Konva.Image({ x: 0, y: 0 }); layer.add(picNode);
  var shapes = new Konva.Group(); layer.add(shapes);
  var temp = new Konva.Group(); layer.add(temp);   // то, что рисуется прямо сейчас
  var tr = new Konva.Transformer({ rotateEnabled: true, ignoreStroke: true, anchorSize: 14, borderStroke: BLUE, anchorStroke: BLUE,
    rotationSnaps: [0, 90, 180, 270], flipEnabled: false,
    padding: 12 });   // ручки отступают от фигуры: у маленького овала палец попадает в середину, а не в ручку
  layer.add(tr);
  var W0 = 1, H0 = 1, zoomed = false;
  var img = new Image();
  img.onload = function () { picNode.image(img); fit(); };
  function fit() {
    stage.width(box.clientWidth); stage.height(box.clientHeight);
    W0 = stage.width(); H0 = W0 * img.height / (img.width || 1);
    picNode.width(W0); picNode.height(H0);
    var s = Math.min(1, stage.height() / H0);
    stage.scale({ x: s, y: s }); stage.position({ x: (W0 - W0 * s) / 2, y: (stage.height() - H0 * s) / 2 });
    rebuild();
  }
  // окно меняется (Telegram разворачивает приложение) — масштаб, который выбрала автор, не сбрасываем
  window.addEventListener('resize', function () { stage.width(box.clientWidth); stage.height(box.clientHeight); if (!zoomed) fit(); });
  var px = function (x) { return x / W0 * 100; }, py = function (y) { return y / H0 * 100; };
  var X = function (p) { return p / 100 * W0; }, Y = function (p) { return p / 100 * H0; };
  function sc() { return stage.scaleX(); }
  function inPic(p) { return { x: Math.max(0, Math.min(100, px(p.x))), y: Math.max(0, Math.min(100, py(p.y))) }; }

  // масштаб: колесо мыши / трекпад — вокруг курсора; два пальца — щипок
  stage.on('wheel', function (ev) {
    ev.evt.preventDefault();
    var p = stage.getPointerPosition(), k = Math.exp(-ev.evt.deltaY * (ev.evt.ctrlKey ? 0.01 : 0.0015));
    zoomTo(Math.max(0.3, Math.min(12, sc() * k)), p);
  });
  function zoomTo(s, p) {
    var old = sc(), wp = { x: (p.x - stage.x()) / old, y: (p.y - stage.y()) / old };
    stage.scale({ x: s, y: s }); stage.position({ x: p.x - wp.x * s, y: p.y - wp.y * s }); zoomed = true; restyle();
  }
  var pinch = null;
  box.addEventListener('touchmove', function (e) {
    if (e.touches.length !== 2) return;
    e.preventDefault(); cancelDraw();
    var a = e.touches[0], b = e.touches[1], r = box.getBoundingClientRect();
    var c = { x: (a.clientX + b.clientX) / 2 - r.left, y: (a.clientY + b.clientY) / 2 - r.top }, d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    if (!pinch) { pinch = { c: c, d: d }; return; }
    zoomTo(Math.max(0.3, Math.min(12, sc() * d / pinch.d)), c);
    stage.position({ x: stage.x() + c.x - pinch.c.x, y: stage.y() + c.y - pinch.c.y });
    pinch = { c: c, d: d };
  }, { passive: false });
  box.addEventListener('touchend', function (e) { if (e.touches.length < 2) pinch = null; });
  // сдвиг: «Двигать», правая или средняя кнопка мыши
  box.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  $('bPan').onclick = function () { pan = !pan; this.classList.toggle('on', pan); stage.draggable(pan); };
  stage.on('dragend', function (ev) { if (ev.target === stage) { zoomed = true; if (!pan) stage.draggable(false); } });

  // ── Рисование: нажать на картинке — новая отметка; нажать на отметку — выбрать её и тянуть ──
  var drawing = null;
  stage.on('mousedown touchstart', function (ev) {
    var e = ev.evt; if (pinch || (e.touches && e.touches.length > 1)) return;
    if (e.button === 1 || e.button === 2) { stage.draggable(true); stage.startDrag(); return; }
    if (pan || !cur) return;
    if (ev.target !== picNode && ev.target !== stage) return;   // по отметке — её выбор и перетаскивание (Konva)
    var p = stage.getRelativePointerPosition(); if (!p) return;
    drawing = { g: geom(), p0: p, pts: [p] };
  });
  stage.on('mousemove touchmove', function () {
    if (!drawing || pinch) return;
    var p = stage.getRelativePointerPosition(); if (!p) return;
    drawing.pts.push(p);
    temp.destroyChildren();
    if (drawing.g === 'oval') temp.add(new Konva.Ellipse({ x: drawing.p0.x, y: drawing.p0.y, radiusX: Math.abs(p.x - drawing.p0.x) || 1, radiusY: Math.abs(p.y - drawing.p0.y) || 1, stroke: BLUE, strokeWidth: 2, strokeScaleEnabled: false, listening: false }));
    else if (isFree()) temp.add(new Konva.Line({ points: flat(drawing.pts), stroke: BLUE, strokeWidth: 2, strokeScaleEnabled: false, listening: false }));
    layer.batchDraw();
  });
  stage.on('mouseup touchend', function () {
    if (!drawing) return;
    var d = drawing; drawing = null; temp.destroyChildren();
    var last = d.pts[d.pts.length - 1], len = 0;
    for (var i = 1; i < d.pts.length; i++) len += Math.hypot(d.pts[i].x - d.pts[i - 1].x, d.pts[i].y - d.pts[i - 1].y);
    var moved = len * sc() > 6;   // больше 6 экранных точек — это движение, а не касание
    if (d.g === 'oval') {
      var r0 = 12 * H0 / FRAME_H, rx = moved ? Math.abs(last.x - d.p0.x) : r0, ry = moved ? Math.abs(last.y - d.p0.y) : r0;
      // совсем плоский овал не нужен никогда: вторая ось — не меньше пятой части первой
      var A = Math.max(0.5, rx * FRAME_H / H0), B = Math.max(0.5, ry * FRAME_H / H0); A = Math.max(A, B / 5); B = Math.max(B, A / 5);
      add({ g: 'oval', pts: [inPic(d.p0)], a: r1(A), b: r1(B), t: 0, touched: moved });
    } else if (isFree() && moved) finishFree(d.pts.map(inPic));
    else tap(inPic(last));
    layer.batchDraw();
  });
  function cancelDraw() { drawing = null; temp.destroyChildren(); }
  function flat(pts) { var o = []; pts.forEach(function (q) { o.push(q.x, q.y); }); return o; }
  function geom() { return cur ? GEOM[cur.mech] : ''; }
  function isFree() { return ['area', 'line', 'path'].indexOf(geom()) >= 0; }
  function simplify(pts, maxN) {
    if (pts.length <= maxN) return pts.map(function (q) { return { x: r1(q.x), y: r1(q.y) }; });
    var step = (pts.length - 1) / (maxN - 1), out = [];
    for (var i = 0; i < maxN; i++) { var q = pts[Math.round(i * step)]; out.push({ x: r1(q.x), y: r1(q.y) }); }
    return out;
  }

  function add(m) { m.e = cur; m.k = {}; marks.push(m); sel = marks.length - 1; rebuild(); renderPanel(); }
  function tap(p) {
    var g = geom();
    if (g === 'point') add({ g: g, pts: [p] });
    else if (g === 'two') { if (!pending) { pending = { g: g, pts: [p] }; rebuild(); } else { pending.pts.push(p); var m = pending; pending = null; add(m); } }
    else if (g === 'points') { if (!pending) pending = { g: g, pts: [] }; pending.pts.push(p); rebuild(); }
    else if (g === 'frame') {
      var w = 40, h = w * 9 / 16 * W0 / H0;   // рамка 16:9 в процентах кадра
      add({ g: g, box: [Math.max(0, p.x - w / 2), Math.max(0, p.y - h / 2), Math.min(100, p.x + w / 2), Math.min(100, p.y + h / 2)], side: 'right' });
    }
    else if (g === 'path') { if (!pending) pending = { g: g, pts: [] }; pending.pts.push(p); rebuild(); }
  }
  function finishFree(pts) {
    var g = geom();
    if (g === 'area') add({ g: g, pts: simplify(pts, 40) });
    else if (g === 'line') add({ g: g, pts: simplify(pts, 30) });
    else if (g === 'path') add({ g: g, pts: simplify(pts, 10), words: '' });
  }
  $('bDone').onclick = function () {
    if (pending && pending.pts.length >= (pending.g === 'points' ? 1 : 2)) { var m = pending; pending = null; if (m.g === 'path') m.words = ''; add(m); }
    else { pending = null; rebuild(); }
  };
  $('bUndo').onclick = function () { if (pending) pending = null; else { marks.pop(); sel = marks.length - 1; } rebuild(); renderPanel(); };

  // ── Фигуры на холсте из отметок. Пересобираются, только когда отметок стало больше или меньше; перенос, растяжение
  //    и поворот меняют числа той же фигуры (пересборка посреди жеста срывала его) ──
  function rebuild() {
    shapes.destroyChildren(); tr.nodes([]);
    marks.forEach(function (m, i) {
      var n = null, common = { stroke: RED, strokeWidth: 2, strokeScaleEnabled: false, draggable: true };
      m.nodes = [];
      if (m.g === 'oval') {
        n = new Konva.Ellipse(Object.assign({ x: X(m.pts[0].x), y: Y(m.pts[0].y), radiusX: m.a * H0 / FRAME_H, radiusY: m.b * H0 / FRAME_H, rotation: m.t, fill: 'rgba(225,29,72,0.15)' }, common));
        n.on('transformend dragend', function () {
          n.radiusX(Math.max(0.5, n.radiusX() * Math.abs(n.scaleX()))); n.radiusY(Math.max(0.5, n.radiusY() * Math.abs(n.scaleY()))); n.scale({ x: 1, y: 1 });
          m.pts[0] = inPic({ x: n.x(), y: n.y() });
          m.a = r1(n.radiusX() * FRAME_H / H0); m.b = r1(n.radiusY() * FRAME_H / H0);
          m.t = ((Math.round(n.rotation()) % 360) + 540) % 360 - 180; m.touched = true; tr.forceUpdate(); renderPanel();
        });
      } else if (m.g === 'frame') {
        var b = m.box;
        n = new Konva.Rect(Object.assign({ x: X(b[0]), y: Y(b[1]), width: X(b[2]) - X(b[0]), height: Y(b[3]) - Y(b[1]), fill: 'rgba(255,255,255,0.12)' }, common));
        n.on('transformend dragend', function () {
          n.width(n.width() * n.scaleX()); n.height(n.height() * n.scaleY()); n.scale({ x: 1, y: 1 });
          m.box = [r1(px(n.x())), r1(py(n.y())), r1(px(n.x() + n.width())), r1(py(n.y() + n.height()))]; tr.forceUpdate(); renderPanel();
        });
      } else if (m.g === 'area' || m.g === 'line' || m.g === 'path') {
        n = new Konva.Line(Object.assign({ points: flat(m.pts.map(function (q) { return { x: X(q.x), y: Y(q.y) }; })), closed: m.g === 'area',
          fill: m.g === 'area' ? 'rgba(225,29,72,0.15)' : undefined, hitStrokeWidth: 14 }, common));
        n.on('dragend', function () {
          var dx = px(n.x()), dy = py(n.y());
          m.pts = m.pts.map(function (q) { return { x: r1(q.x + dx), y: r1(q.y + dy) }; });
          n.position({ x: 0, y: 0 }); n.points(flat(m.pts.map(function (q) { return { x: X(q.x), y: Y(q.y) }; }))); renderPanel();
        });
      } else {
        // точки: каждую можно передвинуть отдельно
        m.pts.forEach(function (q, j) {
          var c = new Konva.Circle({ x: X(q.x), y: Y(q.y), radius: 7 / sc(), fill: RED, stroke: '#fff', strokeWidth: 1, strokeScaleEnabled: false, draggable: true, name: 'dot' });
          c.on('dragend', function () { m.pts[j] = inPic({ x: c.x(), y: c.y() }); if (m.wl) m.wl.points([0, Y(m.pts[1].y), W0, Y(m.pts[1].y)]); renderPanel(); });
          c.on('mousedown touchstart', function () { select(i); });
          shapes.add(c); m.nodes.push(c);
          if (m.g === 'two' && j === 1) { m.wl = new Konva.Line({ points: [0, Y(q.y), W0, Y(q.y)], stroke: RED, dash: [6, 4], strokeWidth: 1, strokeScaleEnabled: false, listening: false }); shapes.add(m.wl); }
        });
      }
      if (n) { n.on('mousedown touchstart', function () { select(i); }); shapes.add(n); m.nodes.push(n); }
    });
    if (pending) pending.pts.forEach(function (q) { shapes.add(new Konva.Circle({ x: X(q.x), y: Y(q.y), radius: 6 / sc(), fill: BLUE, listening: false, name: 'dot' })); });
    paint();
  }
  // выбранная отметка — синяя, у овала и рамки — рамка с ручками; фигуры при этом не пересоздаются
  function paint() {
    tr.nodes([]);
    marks.forEach(function (m, i) {
      var col = i === sel ? BLUE : RED;
      (m.nodes || []).forEach(function (n) { if (n.name() === 'dot') n.fill(col); else n.stroke(col); });
      if (i === sel && (m.g === 'oval' || m.g === 'frame') && m.nodes && m.nodes[0]) {
        tr.keepRatio(m.g === 'frame'); tr.rotateEnabled(m.g === 'oval');
        tr.enabledAnchors(m.g === 'frame' ? ['top-left', 'top-right', 'bottom-left', 'bottom-right'] : ['top-left', 'top-center', 'top-right', 'middle-right', 'middle-left', 'bottom-left', 'bottom-center', 'bottom-right']);
        tr.nodes([m.nodes[0]]); tr.moveToTop();
      }
    });
    layer.batchDraw();
  }
  function select(i) { if (sel === i) return; sel = i; paint(); renderPanel(); }
  // точки остаются одного размера на экране при любом масштабе
  function restyle() { shapes.find('.dot').forEach(function (c) { c.radius(7 / sc()); }); tr.forceUpdate(); layer.batchDraw(); }

  // ── Строка для сборщика: слова — из листа, числа — из разметки ──
  function lineOf(m) {
    var e = m.e, tpl = e.template, W1 = lead(tpl).split(' ')[0];
    var xy = function (q) { return f(q.x) + ', ' + f(q.y); }, sp = function (q) { return f(q.x) + ' ' + f(q.y); };
    var s;
    if (m.g === 'point' || m.g === 'oval') s = W1 + ': ' + xy(m.pts[0]);
    if (m.g === 'oval' && m.touched) {
      if (Math.abs(m.a - m.b) > 0.4 || m.t) s += '; ' + wordFor('oval') + ' ' + f(m.a) + ' × ' + f(m.b) + (m.t ? '; ' + wordFor('tilt') + ' ' + m.t : '');
      else s += '; ' + wordFor('radius') + ' ' + f(m.a);
    }
    if (m.g === 'two') s = W1 + ': ' + xy(m.pts[0]) + ', ' + f(m.pts[1].y);
    if (m.g === 'points') s = W1 + ': ' + m.pts.map(xy).join('; ');
    if (m.g === 'area') s = W1 + ': ' + wordFor('area') + ' ' + m.pts.map(sp).join(', ');
    if (m.g === 'line') s = W1 + ': ' + m.pts.map(sp).join(', ');
    if (m.g === 'path') s = W1 + ': ' + m.pts.map(xy).join(' → ') + (m.words ? '; ' + m.words : '');
    if (m.g === 'frame') {
      var n = marks.filter(function (o) { return o.g === 'frame'; }).indexOf(m), letter = (wordFor(['B', 'V', 'G'][n] || '') || String(n + 1)).toUpperCase();
      var b = m.box;
      s = W1 + ' ' + letter + ': ' + wordFor('frame') + ' ' + sp({ x: b[0], y: b[1] }) + ' — ' + sp({ x: b[2], y: b[3] }) + ', ' + wordFor(m.side);
    }
    Object.keys(m.k).forEach(function (k) { var v = String(m.k[k] == null ? '' : m.k[k]).trim().replace('−', '-'); if (/^-?\d+([.,]\d+)?$/.test(v)) s += '; ' + k + ' ' + v; });
    return s;
  }

  function renderPanel() {
    var pb = $('panel'); pb.innerHTML = '';
    marks.forEach(function (m, i) {
      var d = document.createElement('div'); d.className = 'mk' + (i === sel ? ' sel' : '');
      var row = document.createElement('div'); row.className = 'row';
      var nm = document.createElement('span'); nm.className = 'name'; nm.textContent = (i + 1) + '. ' + m.e.name; row.appendChild(nm);
      nm.onclick = function () { sel = i; paint(); renderPanel(); };
      if (m.g === 'frame') ['left', 'center', 'right'].forEach(function (sd) {
        var b = document.createElement('button'); b.className = 'btn' + (m.side === sd ? ' on' : ''); b.textContent = wordFor(sd) || sd;
        b.onclick = function () { m.side = sd; renderPanel(); }; row.appendChild(b);
      });
      var del = document.createElement('button'); del.className = 'btn'; del.textContent = '✕';
      del.onclick = function () { marks.splice(i, 1); sel = marks.length - 1; rebuild(); renderPanel(); }; row.appendChild(del);
      d.appendChild(row);
      var code = document.createElement('code');
      // ручка: − число + ; число — сколько сейчас (своё или канала из листа); нетронутая ручка в строку не пишется,
      // нажатие на число возвращает как у канала
      knobNames(m.e.knobs).forEach(function (k) {
        var lb = document.createElement('label'); lb.className = 'knob'; lb.appendChild(document.createTextNode(k));
        var minus = document.createElement('button'), num = document.createElement('button'), plus = document.createElement('button');
        minus.className = plus.className = num.className = 'btn kb'; minus.textContent = '−'; plus.textContent = '+';
        function show() { var own = m.k[k] != null && m.k[k] !== ''; num.textContent = own ? m.k[k] : chanVal(m.e, k); num.style.borderColor = own ? 'var(--acc)' : ''; code.textContent = lineOf(m); }
        function step(dv) { var v = Number(String(m.k[k] != null && m.k[k] !== '' ? m.k[k] : chanVal(m.e, k)).replace(',', '.')) || 0; m.k[k] = String(r1(v + dv)); show(); }
        minus.onclick = function () { step(-1); }; plus.onclick = function () { step(1); }; num.onclick = function () { delete m.k[k]; show(); };
        lb.appendChild(minus); lb.appendChild(num); lb.appendChild(plus); d.appendChild(lb);
        show();
      });
      if (m.g === 'path') {
        var tx = document.createElement('input'); tx.type = 'text'; tx.placeholder = 'слова через «;» (см. «Ручки» в листе)'; tx.value = m.words || '';
        tx.oninput = function () { m.words = tx.value.trim(); code.textContent = lineOf(m); }; d.appendChild(tx);
      }
      code.textContent = lineOf(m); d.appendChild(code);
      pb.appendChild(d);
    });
    if (tg) {
      if (marks.length) { tg.MainButton.setText('Отправить в бот (' + marks.length + ')'); tg.MainButton.show(); } else tg.MainButton.hide();
    }
  }

  // Открыто кнопкой меню бота — выпуск ещё не выбран: сначала список выпусков, которые можно оживить
  function chooseEpisode() {
    $('hint').textContent = 'Какой выпуск оживляем?';
    fetch(location.pathname + '?episodes=1').then(function (r) { return r.json(); }).then(function (d) {
      var pb = $('panel'); pb.innerHTML = '';
      var list = d.episodes || [];
      if (!list.length) { pb.textContent = 'Нет выпусков с согласованной картинкой, которые ещё не вышли.'; return; }
      list.forEach(function (e) {
        var b = document.createElement('button'); b.className = 'btn'; b.style.cssText = 'display:block;width:100%;text-align:left;margin:6px 0;white-space:normal';
        b.textContent = e.title + (e.status ? ' · ' + e.status : '');
        b.onclick = function () { PROJECT = e.p; CHANNEL = e.ch; IMG = e.img; pb.innerHTML = ''; load(); };
        pb.appendChild(b);
      });
    }).catch(function (e) { say('Не загрузился список выпусков: ' + e, 6000); });
  }
  function load() {
    if (!PROJECT) return chooseEpisode();
    var url = location.pathname + '?catalog=1&ch=' + encodeURIComponent(CHANNEL);
    fetch(url).then(function (r) { return r.json(); }).then(function (d) {
      (d.words || []).forEach(function (w) { if (!WORDS[w.means]) WORDS[w.means] = w.word; });
      CAT = (d.effects || []).filter(function (e) { return GEOM[e.mech] && /^готов/.test(e.status || ''); });
      if (!CAT.length) return say('В листе «Эффекты» нет готовых эффектов для этого канала', 5000);
      buildTools(); pick(CAT[0]);
    }).catch(function (e) { say('Не загрузился лист «Эффекты»: ' + e, 6000); });
    if (IMG) img.src = IMG; else say('Нет картинки выпуска', 4000);
  }
  function buildTools() {
    var tb = $('tools'); tb.innerHTML = '';
    CAT.forEach(function (e) {
      var b = document.createElement('button'); b.textContent = e.name; b.onclick = function () { pick(e); };
      e._btn = b; tb.appendChild(b);
    });
  }
  function pick(e) {
    cur = e; pending = null;
    CAT.forEach(function (x) { x._btn.classList.toggle('on', x === e); });
    $('hint').textContent = e.marks || '';
    rebuild();
  }

  // ── Отправка: строки уходят в бот и записываются в пункт оживления выпуска ──
  function send(mode) {
    var lines = marks.map(lineOf).join('\n');
    var chatId = tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : null;
    fetch(SUBMIT, { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'fx', projectId: PROJECT, chatId: chatId, mode: mode, lines: lines }) })
      .then(function (r) { if (!r.ok) throw new Error(r.status); say('Отправлено ✅'); setTimeout(function () { if (tg) tg.close(); }, 900); })
      .catch(function (e) { say('Не отправилось: ' + e, 5000); });
  }
  if (tg) tg.MainButton.onClick(function () {
    tg.showPopup({ message: 'Строки оживления в выпуске:', buttons: [{ id: 'replace', type: 'default', text: 'Записать вместо прежних' },
      { id: 'add', type: 'default', text: 'Дописать к прежним' }, { type: 'cancel' }] }, function (id) { if (id) send(id); });
  });
  load();
})();
</script>
