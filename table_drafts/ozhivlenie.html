<style>
  /* (29.10) Приложение разметки оживления в боте. Холст — библиотека Konva (как в редакторах: тянуть, растягивать,
     поворачивать, масштаб колесом и двумя пальцами). Код знает только геометрию эффекта (точка, овал, обводка,
     путь, рамка); какие эффекты есть, их названия, подсказки, ручки и слова строк — из листа «Эффекты». */
  :root { --bg: #f6f3ee; --ink: #2b2620; --mute: #786e62; --line: #d9d0c3; --mark: #e11d48; --acc: #2563eb; --card: #fffdf9; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1d1a17; --ink: #ece6dc; --mute: #a69b8d; --line: #3a342d; --card: #26221e; } }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.35 -apple-system, system-ui, sans-serif; overflow: hidden; }
  #app { display: flex; flex-direction: column; height: 100%; }
  #tools { display: flex; gap: 6px; overflow-x: auto; padding: 8px; border-bottom: 1px solid var(--line); flex: none; }
  #tools button, .btn { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 18px; padding: 7px 12px; font: inherit; white-space: nowrap; cursor: pointer; }
  #tools button.on, .btn.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  #stage { position: relative; flex: 1 1 auto; overflow: hidden; touch-action: none; background: #000; }
  #fx { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 2; }
  /* высоты подсказки и панели постоянные: новая отметка не сжимает картинку и не сдвигает её */
  #hint { flex: none; padding: 6px 10px; color: var(--mute); font-size: 13px; border-top: 1px solid var(--line); height: 3.6em; overflow: auto; }
  #panel { flex: none; height: 28vh; overflow: auto; border-top: 1px solid var(--line); padding: 6px 8px 10px; }
  .mk { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 6px 8px; margin: 6px 0; }
  .mk.sel { border-color: var(--acc); }
  .mk .row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .mk .name { font-weight: 600; flex: 1; cursor: pointer; }
  /* ручка — своя строка: название | − ползунок + | число мелко */
  .knob { display: grid; grid-template-columns: 6.5em 2.4em 1fr 2.4em 2.2em; align-items: center; gap: 6px; margin: 6px 0; }
  .knob .kn { font-size: 14px; }
  .knob .kb { padding: 4px 0; border-radius: 8px; font-size: 18px; line-height: 1; }
  .knob input[type=range] { width: 100%; height: 28px; margin: 0; accent-color: var(--acc); }
  .knob .kv { font-size: 12px; color: var(--mute); text-align: right; cursor: pointer; }
  .knob .kv.own { color: var(--acc); }
  /* панель листа */
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 6px; margin: 6px 0; }
  .tile { position: relative; border: 2px solid var(--line); background: var(--bg); border-radius: 8px; padding: 2px; cursor: pointer; }
  .tile.on { border-color: var(--acc); background: rgba(37,99,235,0.12); }
  .tile img { width: 100%; aspect-ratio: 1; object-fit: contain; display: block; }
  .tile span { position: absolute; right: 3px; bottom: 1px; font-size: 11px; color: var(--mute); }
  .lrow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 6px 0; }
  .lrow .kn { min-width: 6.5em; font-size: 14px; }
  .lrow label { font-size: 14px; display: inline-flex; align-items: center; gap: 4px; }
  .lrow select { font: inherit; padding: 4px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
  .lrow input[type=range] { flex: 1; min-width: 120px; accent-color: var(--acc); }
  .tonescale { display: flex; justify-content: space-between; font-size: 11px; color: var(--mute); margin: -4px 0 4px 6.5em; }
  .mk .hn, #panel .hn { font-size: 13px; color: var(--mute); margin: 4px 0; }
  #panel .list { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
  #panel .list .btn { padding: 5px 10px; font-size: 14px; }
  /* полосы прокрутки и масштаб — поверх картинки, широкие, чтобы стилусом попадать */
  .sb { position: absolute; z-index: 3; background: rgba(0,0,0,0.35); border-radius: 12px; touch-action: none; cursor: pointer; display: none; }
  #sbX { left: 8px; right: 38px; bottom: 6px; height: 24px; }
  #sbY { top: 8px; bottom: 38px; right: 6px; width: 24px; }
  .sb i { position: absolute; background: rgba(255,255,255,0.88); border-radius: 10px; }
  #sbX i { top: 4px; bottom: 4px; } #sbY i { left: 4px; right: 4px; }
  #zoom { position: absolute; z-index: 3; top: 8px; left: 8px; display: flex; flex-direction: column; gap: 8px; }
  #zoom button { width: 42px; height: 42px; border-radius: 21px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font-size: 22px; line-height: 1; cursor: pointer; padding: 0; }
  #tools { scrollbar-width: thin; }
  /* узкий экран (телефон): пока эффект не открыт, ручек нет — картинка почти во весь экран */
  @media (max-width: 600px) { #app.closed #panel { height: auto; max-height: 14vh; } }
  .mk input[type=text] { width: 100%; padding: 4px; font: inherit; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); margin-top: 4px; }
  .mk code { font-size: 12px; color: var(--mute); word-break: break-all; display: block; margin-top: 4px; }
  #bar { flex: none; display: flex; gap: 6px; padding: 8px; border-top: 1px solid var(--line); }
  #bar .btn { flex: 1; padding: 7px 6px; }
  #bar #bClose { flex: 0 0 auto; }
  /* окошко строк: можно выделить и скопировать руками на всякий случай */
  #linesBox { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: none; z-index: 8; align-items: center; justify-content: center; padding: 16px; }
  #linesBox .card { background: var(--card); border-radius: 12px; padding: 12px; width: 100%; max-width: 720px; display: flex; flex-direction: column; gap: 8px; }
  #linesBox .row { display: flex; justify-content: space-between; align-items: center; }
  #linesBox textarea { width: 100%; height: 45vh; font: 13px/1.4 ui-monospace, monospace; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); resize: vertical; }
  @media (max-width: 600px) { #bar .btn { font-size: 13px; padding: 7px 3px; } }
  #msg { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%); background: var(--ink); color: var(--bg); padding: 12px 16px; border-radius: 12px; display: none; max-width: 86vw; text-align: center; z-index: 9; pointer-events: none; }
</style>
</head>
<body>
<div id="app">
  <div id="tools"></div>
  <div id="stage"></div>
  <div id="hint"></div>
  <div id="panel"></div>
  <div id="bar">
    <button class="btn" id="bDone">✓ Готово</button>
    <button class="btn" id="bUndo">↶</button>
    <button class="btn" id="bLines">📋 Строки</button>
    <button class="btn" id="bSend">📨 Отправить в бот</button>
    <button class="btn" id="bClose">✕</button>
  </div>
</div>
<div id="msg"></div>
<div id="linesBox"><div class="card">
  <div class="row"><b>Строки оживления</b><button class="btn" id="bLinesClose">✕</button></div>
  <textarea id="linesText" readonly></textarea>
  <button class="btn" id="bCopy">Скопировать</button>
</div></div>
<script>
(function () {
  var tg = window.Telegram && Telegram.WebApp; if (tg) { tg.ready(); tg.expand(); }
  var Q = new URLSearchParams(location.search);
  var PROJECT = Q.get('p') || '', CHANNEL = Q.get('ch') || '', IMG = Q.get('img') || '', SUBMIT = Q.get('submit') || '';
  var $ = function (id) { return document.getElementById(id); };
  function say(t, ms) { var m = $('msg'); m.textContent = t; m.style.display = 'block'; clearTimeout(say.t); say.t = setTimeout(function () { m.style.display = 'none'; }, ms || 2200); }
  function r1(v) { return Math.round(v * 10) / 10; }
  function f(v) { return String(r1(v)); }
  $('bClose').onclick = function () { if (tg) tg.close(); else window.close(); };
  if (!window.Konva) { say('Не загрузилась библиотека холста — проверьте интернет и откройте ещё раз', 8000); return; }

  // ── Геометрия по механике (это механика, не содержание): как ставится разметка ──
  var GEOM = { steam_cup: 'oval', blink: 'oval', smoke: 'point', candle: 'point', bubbles: 'two', lights: 'points',
    steam_surface: 'area', rain: 'area', stars: 'area', fire: 'area', behind: 'area', edge: 'line', leaves: 'path', cover: 'frame' };
  var FRAME_H = 864;   // овал — в пикселях кадра высотой 864 (так его читает сборщик)
  var RED = '#e11d48', BLUE = '#2563eb';

  var CAT = [], WORDS = {}, cur = null, marks = [], sel = -1;

  // Слова строк — из листа: слово эффекта — из колонки «Строка для сборщика», ручки — из «Ручки»,
  // слова частей (область, овал, наклон, кадр, справа…) — из словарика («Слово» → «Значит»)

    function upd() { m.words = leafWords(L); code.textContent = lineOf(m); }
    function row(title) { var r = document.createElement('div'); r.className = 'lrow'; var s = document.createElement('span'); s.className = 'kn'; s.textContent = title; r.appendChild(s); d.appendChild(r); return r; }
    var tiles = document.createElement('div'); tiles.className = 'tiles';
    LEAF_THUMBS.forEach(function (src, j) {
      var n = j + 1, b = document.createElement('button'); b.className = 'tile' + (L.samples.indexOf(n) >= 0 ? ' on' : ''); b.title = String(n);
      var im = document.createElement('img'); im.src = src; im.alt = String(n); b.appendChild(im);
      var cap = document.createElement('span'); cap.textContent = n; b.appendChild(cap);
      b.onclick = function () { save(); var i = L.samples.indexOf(n); if (i >= 0) L.samples.splice(i, 1); else L.samples.push(n); L.samples.sort(function (a, c) { return a - c; }); b.classList.toggle('on', i < 0); upd(); };
      tiles.appendChild(b);
    });
    d.appendChild(tiles);
    var rs = row('размер');
    [['small', 'мелкий'], ['', 'средний'], ['big', 'крупный']].forEach(function (o) {
      var b = document.createElement('button'); b.className = 'btn' + (L.size === o[0] ? ' on' : ''); b.textContent = o[1];
      b.onclick = function () { save(); L.size = o[0]; rs.querySelectorAll('.btn').forEach(function (x) { x.classList.remove('on'); }); b.classList.add('on'); upd(); };
      rs.appendChild(b);
    });
    var rf = row('как часто'), sel = document.createElement('select');
    [['', 'как в таблице'], [20, 'раз в 20 с'], [40, 'раз в 40 с'], [60, 'раз в минуту'], [120, 'раз в 2 мин'], [240, 'раз в 4 мин'], [600, 'раз в 10 мин']].forEach(function (o) {
      var op = document.createElement('option'); op.value = o[0]; op.textContent = o[1]; if (String(L.every) === String(o[0])) op.selected = true; sel.appendChild(op);
    });
    sel.onchange = function () { save(); L.every = sel.value ? Number(sel.value) : ''; upd(); }; rf.appendChild(sel);
    var rc = row('цвет'), own = document.createElement('label'), ocb = document.createElement('input'); ocb.type = 'checkbox'; ocb.checked = L.tone == null;
    own.appendChild(ocb); own.appendChild(document.createTextNode(' как нарисован')); rc.appendChild(own);
    var rg = document.createElement('input'); rg.type = 'range'; rg.min = 1; rg.max = 10; rg.step = 0.5; rg.value = L.tone == null ? 6 : L.tone; rg.disabled = L.tone == null;
    var vary = document.createElement('label'), vcb = document.createElement('input'); vcb.type = 'checkbox'; vcb.checked = !!L.vary; vcb.disabled = L.tone == null;
    vary.appendChild(vcb); vary.appendChild(document.createTextNode(' каждый чуть по-своему'));
    var scale = document.createElement('div'); scale.className = 'tonescale'; scale.innerHTML = '<span>бурый</span><span>красный</span><span>оранжевый</span><span>жёлтый</span>';
    var rc2 = row(''); rc2.appendChild(rg); rc2.appendChild(vary);
    d.appendChild(scale);
    ocb.onchange = function () { save(); L.tone = ocb.checked ? null : Number(rg.value); rg.disabled = vcb.disabled = ocb.checked; upd(); };
    rg.addEventListener('pointerdown', save); rg.oninput = function () { L.tone = Number(rg.value); upd(); };
    vcb.onchange = function () { save(); L.vary = vcb.checked; upd(); };
    var rx = row('');
    [['deep', 'вглубь: уменьшается, пока падает'], ['behind', 'за край: скрывается за линией «край»']].forEach(function (o) {
      var lb = document.createElement('label'), cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = !!L[o[0]];
      cb.onchange = function () { save(); L[o[0]] = cb.checked; upd(); };
      lb.appendChild(cb); lb.appendChild(document.createTextNode(' ' + o[1])); rx.appendChild(lb);
    });
  }
  function renderPanel() {
    var pb = $('panel'); pb.innerHTML = '';
    var m = openMark();
    $('app').classList.toggle('closed', !m);
    if (m) {
      var d = document.createElement('div'); d.className = 'mk sel';
      var row = document.createElement('div'); row.className = 'row';
      var nm = document.createElement('span'); nm.className = 'name'; nm.textContent = (sel + 1) + '. ' + m.e.name; row.appendChild(nm);
      if (m.g === 'frame') ['left', 'center', 'right'].forEach(function (sd) {
        var b = document.createElement('button'); b.className = 'btn' + (m.side === sd ? ' on' : ''); b.textContent = wordFor(sd) || sd;
        b.onclick = function () { save(); m.side = sd; renderPanel(); }; row.appendChild(b);
      });
      var del = document.createElement('button'); del.className = 'btn'; del.textContent = '🗑 Убрать';
      del.onclick = function () { save(); marks.splice(sel, 1); sel = -1; rebuild(); renderPanel(); markTools(); setCursor(); }; row.appendChild(del);
      d.appendChild(row);
      if (m.collect) { var hn = document.createElement('div'); hn.className = 'hn'; hn.textContent = m.e.marks || ''; d.appendChild(hn); }
      var code = document.createElement('code');
      // нетронутая ручка в строку не пишется (стоит как у канала из листа); нажатие на число — вернуть как у канала
      knobNames(m.e.knobs).forEach(function (k) {
        var kr = document.createElement('div'); kr.className = 'knob';
        var lb = document.createElement('span'); lb.className = 'kn'; lb.textContent = k;
        var minus = document.createElement('button'), plus = document.createElement('button'), num = document.createElement('span');
        var rg = document.createElement('input'); rg.type = 'range'; rg.min = 0; rg.max = 10; rg.step = 0.1;
        minus.className = plus.className = 'btn kb'; minus.textContent = '−'; plus.textContent = '+'; num.className = 'kv';
        function val() { return Number(String(m.k[k] != null && m.k[k] !== '' ? m.k[k] : chanVal(m.e, k)).replace(',', '.')) || 0; }
        function show() { var own = m.k[k] != null && m.k[k] !== ''; num.textContent = String(r1(val())); num.classList.toggle('own', own); rg.value = val(); code.textContent = lineOf(m); }
        function setv(v) { m.k[k] = String(r1(v)); show(); }
        minus.onclick = function () { save(); setv(val() - 0.5); }; plus.onclick = function () { save(); setv(val() + 0.5); };
        rg.addEventListener('pointerdown', save); rg.addEventListener('keydown', save);
        rg.oninput = function () { setv(Number(rg.value)); };
        num.onclick = function () { save(); delete m.k[k]; show(); };
        kr.appendChild(lb); kr.appendChild(minus); kr.appendChild(rg); kr.appendChild(plus); kr.appendChild(num); d.appendChild(kr);
        show();
      });
      if (m.g === 'path') leafPanel(m, d, code);
      code.textContent = lineOf(m); d.appendChild(code);
      pb.appendChild(d);
    }
    if (marks.length) {
      var ls = document.createElement('div'); ls.className = 'list';
      marks.forEach(function (o, i) {
        if (i === sel) return;
        var b = document.createElement('button'); b.className = 'btn'; b.textContent = (i + 1) + '. ' + o.e.name;
        b.onclick = function () { select(i); }; ls.appendChild(b);
      });
      if (ls.childNodes.length) pb.appendChild(ls);
    }
    if (tg) {
      if (marks.length) { tg.MainButton.setText('Отправить в бот (' + marks.length + ')'); tg.MainButton.show(); } else tg.MainButton.hide();
    }
  }

  // Открыто кнопкой меню бота — выпуск ещё не выбран: сначала список выпусков, которые можно оживить
  function chooseEpisode() {
    $('hint').textContent = 'Какой выпуск оживляем?';
    fetch(location.pathname + '?episodes=1').then(function (r) { return r.json(); }).then(function (d) {
      var pb = $('panel'); pb.innerHTML = '';
      var list = d.episodes || [];
      if (!list.length) { pb.textContent = 'Нет выпусков с согласованной картинкой, которые ещё не вышли.'; return; }
      list.forEach(function (e) {
        var b = document.createElement('button'); b.className = 'btn'; b.style.cssText = 'display:block;width:100%;text-align:left;margin:6px 0;white-space:normal';
        b.textContent = e.title + (e.status ? ' · ' + e.status : '');
        b.onclick = function () { PROJECT = e.p; CHANNEL = e.ch; IMG = e.img; pb.innerHTML = ''; load(); };
        pb.appendChild(b);
      });
    }).catch(function (e) { say('Не загрузился список выпусков: ' + e, 6000); });
  }
  function load() {
    if (!PROJECT) return chooseEpisode();
    var url = location.pathname + '?catalog=1&ch=' + encodeURIComponent(CHANNEL);
    fetch(url).then(function (r) { return r.json(); }).then(function (d) {
      (d.words || []).forEach(function (w) { if (!WORDS[w.means]) WORDS[w.means] = w.word; });
      CAT = (d.effects || []).filter(function (e) { return GEOM[e.mech] && /^готов/.test(e.status || ''); });
      if (!CAT.length) return say('В листе «Эффекты» нет готовых эффектов для этого канала', 5000);
      buildTools(); restore(); markTools(); renderPanel(); setCursor();
    }).catch(function (e) { say('Не загрузился лист «Эффекты»: ' + e, 6000); });
    if (IMG) img.src = IMG; else say('Нет картинки выпуска', 4000);
  }
  function buildTools() {
    var tb = $('tools'); tb.innerHTML = '';
    CAT.forEach(function (e) {
      var b = document.createElement('button'); b.textContent = e.name; b.onclick = function () { pick(e); };
      e._btn = b; tb.appendChild(b);
    });
  }
  // полоску эффектов крутит и колесо мыши
  $('tools').addEventListener('wheel', function (e) {
    var d = Math.abs(e.deltaY) > Math.abs(e.deltaX) ? e.deltaY : e.deltaX; if (!d) return;
    e.preventDefault(); this.scrollLeft += d;
  }, { passive: false });
  // выбрать эффект в полоске — следующее касание (или протяжка) ставит его; открытый эффект при этом закрывается
  function pick(e) {
    if (cur === e) { cur = null; markTools(); setCursor(); renderPanel(); return; }
    if (sel >= 0) $('bDone').onclick();
    cur = e; markTools(); setCursor(); renderPanel();
  }
  function markTools() {
    var on = cur || (openMark() && openMark().e);
    CAT.forEach(function (x) { if (x._btn) x._btn.classList.toggle('on', x === on); });
    $('hint').textContent = cur ? (cur.marks || '') : openMark() ? '' : (marks.length ? 'Картинку можно тянуть. Нажмите на отметку, чтобы поправить, или выберите следующий эффект сверху' : 'Выберите эффект в полоске сверху');
  }

  // ── Разметка запоминается на этом устройстве (для каждого выпуска своя): закрыли приложение, не дошла отправка —
  //    при следующем открытии всё на месте. Пишется после каждого изменения. ──
  var KEY = 'ozhivlenie:' + PROJECT, savedJson = '';
  function snapshot() {
    return JSON.stringify(marks.map(function (m) { var o = copyMark(m); o.e = { mech: m.e.mech, name: m.e.name }; delete o.collect; return o; }));
  }
  function persist() {
    if (!PROJECT || !CAT.length) return;
    var s = snapshot(); if (s === savedJson) return;
    try { localStorage.setItem(KEY, s); savedJson = s; } catch (e) { }
  }
  function restore() {
    var s = null; try { s = localStorage.getItem(KEY); } catch (e) { }
    if (!s) return;
    try {
      var list = JSON.parse(s), out = [];
      list.forEach(function (o) {
        var e = CAT.filter(function (x) { return x.mech === o.e.mech && x.name === o.e.name; })[0] || CAT.filter(function (x) { return x.mech === o.e.mech; })[0];
        if (e) { o.e = e; out.push(o); }
      });
      if (!out.length) return;
      marks = out; sel = -1; savedJson = s; rebuild();
      say('Разметка на месте: ' + out.length + ' ' + (out.length === 1 ? 'отметка' : out.length < 5 ? 'отметки' : 'отметок'), 2600);
    } catch (e) { }
  }
  setInterval(persist, 700);
  window.addEventListener('pagehide', persist);
  document.addEventListener('visibilitychange', persist);

  // окошко со строками — выделить и скопировать руками
  function allLines() { return marks.map(lineOf).join('\n'); }
  $('bLines').onclick = function () {
    if (!marks.length) return say('Отметок пока нет');
    $('linesText').value = allLines(); $('linesBox').style.display = 'flex';
  };
  $('bLinesClose').onclick = function () { $('linesBox').style.display = 'none'; };
  $('bCopy').onclick = function () {
    var ta = $('linesText'); ta.focus(); ta.select();
    var done = function () { say('Скопировано'); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(done, function () { try { document.execCommand('copy'); done(); } catch (e) { say('Выделено — скопируйте сами'); } });
    else { try { document.execCommand('copy'); done(); } catch (e) { say('Выделено — скопируйте сами'); } }
  };

  // ── Отправка: строки уходят в бот и записываются в пункт оживления выпуска ──
  function send(mode) {
    persist(); var lines = allLines();
    var chatId = tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : null;
    fetch(SUBMIT, { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'fx', projectId: PROJECT, chatId: chatId, mode: mode, lines: lines }) })
      .then(function (r) { if (!r.ok) throw new Error(r.status); say('Отправлено ✅'); setTimeout(function () { if (tg) tg.close(); }, 900); })
      .catch(function (e) { say('Не отправилось: ' + e + '. Разметка сохранена, строки — в окошке', 6000); $('bLines').onclick(); });
  }
  function askSend() {
    if (tg && tg.showPopup) tg.showPopup({ message: 'Строки оживления в выпуске:', buttons: [{ id: 'replace', type: 'default', text: 'Записать вместо прежних' },
      { id: 'add', type: 'default', text: 'Дописать к прежним' }, { type: 'cancel' }] }, function (id) { if (id) send(id); });
    else if (window.confirm('Записать вместо прежних строк оживления? (Отмена — дописать к прежним)')) send('replace'); else send('add');
  }
  if (tg) tg.MainButton.onClick(askSend);
  load();
})();
</script>
</body>
</html>
