<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Контент-план</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Nunito+Sans:wght@400;600;700&display=swap">
<style>
/* Раскладка: сверху месяц-сетка с выпусками по дням, ниже — карточка выбранного дня, ещё ниже копилка идей. Телефон первым. */
:root {
  --bg: #f6f1e8;
  --paper: #fffdf8;
  --ink: #2c2620;
  --muted: #7a6e60;
  --line: #e4dacb;
  --accent: #8a5a2b;
  --pengui: #c0463a;
  --lumos: #4a5fb0;
  --unicorn: #b88a1e;
  --c3: #2f7a78; --c4: #8a4f9e;
  --soft: #efe6d7;
  --display: "Lora", Georgia, serif;
  --body: "Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1c1915; --paper: #26221d; --ink: #f1ebe1; --muted: #a99d8d; --line: #3a342c;
    --accent: #d9a36a; --pengui: #e07063; --lumos: #8b9ee8; --unicorn: #dcb24a; --soft: #2f2a23;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1c1915; --paper: #26221d; --ink: #f1ebe1; --muted: #a99d8d; --line: #3a342c;
  --accent: #d9a36a; --pengui: #e07063; --lumos: #8b9ee8; --unicorn: #dcb24a; --soft: #2f2a23;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; padding-inline: 16px; padding-block: 12px; overflow: hidden; }
.wrap { max-width: 1200px; margin-inline: auto; height: 100%; display: flex; flex-direction: column; gap: 10px; }
.cols { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 10px; }
.col { min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; gap: 10px; }
h1 { font-family: var(--display); font-weight: 600; font-size: 20px; margin: 0; text-wrap: balance; }
.sub { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.badge { display: inline-block; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); border: 1px solid var(--accent); border-radius: 999px; padding: 1px 8px; margin-left: 6px; vertical-align: middle; font-family: var(--body); font-weight: 700; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
button { font: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; min-height: 40px; padding: 6px 12px; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.chip[aria-pressed="true"] { border-color: currentColor; font-weight: 700; background: var(--soft); }
.chip .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
.c-pengui { color: var(--pengui); } .c-lumos { color: var(--lumos); } .c-unicorn { color: var(--unicorn); }
.ru { color: var(--muted); font-weight: 400; }
.chbtn { min-height: 30px; padding: 2px 8px; font-size: 12px; color: #fff; border: 0; }
.save { font-size: 12px; color: var(--muted); }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.monthbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.monthbar h2 { font-family: var(--display); font-weight: 600; font-size: 19px; margin: 0; }
.grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.wd { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); text-align: center; padding-bottom: 2px; }
.day { min-height: 64px; border: 1px solid var(--line); border-radius: 9px; padding: 3px; display: flex; flex-direction: column; gap: 2px; background: var(--bg); cursor: pointer; text-align: left; min-width: 0; }
.day.out { visibility: hidden; }
.day.today { border-color: var(--accent); border-width: 2px; }
.day.sel { background: var(--soft); outline: 2px solid var(--accent); }
.day .n { font-size: 12px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.pill { font-size: 10px; line-height: 1.2; color: #fff; border-radius: 5px; padding: 2px 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill.done { opacity: .55; text-decoration: line-through; }
.hint { font-size: 12px; color: var(--muted); }
.dayhead { font-family: var(--display); font-size: 18px; font-weight: 600; margin: 0; }
.slot { border-left: 4px solid currentColor; padding: 6px 8px; border-radius: 6px; background: var(--bg); display: flex; flex-direction: column; gap: 6px; }
.slot .t { color: var(--ink); font-weight: 700; }
.slot .note { color: var(--muted); font-size: 13px; }
.steps { display: flex; flex-wrap: wrap; gap: 4px; }
.step { font-size: 12px; min-height: 30px; padding: 3px 8px; border-radius: 999px; }
.step[aria-pressed="true"] { background: currentColor; }
.step[aria-pressed="true"] span { color: var(--paper); }
.empty { color: var(--muted); font-style: italic; margin: 0; }
.dgroup { display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--line); padding-top: 8px; }
.dgroup:first-child { border-top: 0; padding-top: 0; }
.dgroup h4 { margin: 0; font-family: var(--display); font-size: 15px; font-weight: 600; color: var(--ink); }
.idea { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: start; }
.idea .date { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; padding-top: 2px; }
.idea .t { font-weight: 600; overflow-wrap: anywhere; }
.idea .note { color: var(--muted); font-size: 12.5px; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.idea button { min-height: 34px; font-size: 13px; white-space: nowrap; }
.label { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
@media (orientation: landscape) {
  .col:first-child > .card { flex: 1; min-height: 0; }
  .col:first-child .grid { flex: 1; min-height: 0; grid-template-rows: auto; grid-auto-rows: minmax(0, 1fr); }
}
header { display: flex; flex-wrap: wrap; align-items: center; column-gap: 12px; row-gap: 4px; }
header .sub { flex-basis: 100%; order: 3; }
.col:first-child .grid .wd { align-self: end; }
.day { min-height: 0; overflow: hidden; }
#ghint:empty { display: none; }
@media (orientation: landscape) and (max-height: 600px) {
  body { padding-block: 6px; padding-inline: 10px; font-size: 13.5px; }
  .wrap { gap: 6px; }
  header .sub { display: none; }
  h1 { font-size: 16px; }
  .chip { min-height: 28px; padding: 2px 8px; font-size: 12.5px; }
  .card { padding: 6px 8px; gap: 6px; }
  .monthbar h2 { font-size: 14px; }
  .monthbar button { min-height: 28px; padding: 0 8px; }
  .grid { gap: 2px; }
  .wd { font-size: 9.5px; padding: 0; }
  .day { padding: 1px 3px; border-radius: 6px; }
  .day .n { font-size: 10.5px; }
  .pill { font-size: 9px; padding: 0 3px; }
  .dayhead { font-size: 15px; }
}
.toast { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 8px 14px; border-radius: 10px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100% - 32px); }
.toast.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
.day.target { border-style: dashed; border-color: var(--accent); }
@media (max-width: 700px) {
  body { padding-inline: 8px; font-size: 14px; }
  .card { padding: 8px; }
  .grid { gap: 2px; }
  .day { min-height: 38px; padding: 2px; border-radius: 6px; }
  .day .n { font-size: 10.5px; }
  .pill { font-size: 0; height: 5px; padding: 0; border-radius: 3px; }
  .wd { font-size: 9px; }
  .monthbar h2 { font-size: 15px; }
  .monthbar button { min-height: 32px; padding: 2px 8px; }
  .idea { gap: 6px; }
  .idea button { padding: 3px 8px; min-height: 30px; font-size: 12px; }
  .sub { display: none; }
  .chip { min-height: 32px; padding: 3px 8px; font-size: 13px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Контент-план <span class="save" id="savest"></span></h1>
    <p class="sub">Слева план выпусков, справа поводы из листа «Календарь». Всё сохраняется в таблицу сразу.</p>
    <div class="row" id="chans" role="group" aria-label="Каналы"></div>
  </header>

  <div class="cols">
  <div class="col">
  <section class="card" aria-label="Месяц">
    <div class="monthbar">
      <button id="prev" type="button" aria-label="Предыдущий месяц">‹</button>
      <h2 id="mname"></h2>
      <button id="next" type="button" aria-label="Следующий месяц">›</button>
    </div>
    <div class="grid" id="grid"></div>
    <p class="hint" id="ghint"></p>
  </section>

  </div>

  <div class="col">
  <section class="card" aria-label="Выбранный день" id="daycard"></section>
  <section class="card" aria-label="Копилка">
    <div class="row" style="justify-content: space-between">
      <div class="label">Копилка идей — <span id="kcount"></span></div>
      <span class="hint" id="khint"></span>
    </div>
    <div id="kop"></div>
  </section>
  </div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(function () {
  if (window.Telegram && Telegram.WebApp) { try { Telegram.WebApp.ready(); Telegram.WebApp.expand(); } catch (e) {} }
  var BASE = location.pathname.replace(/\/+$/, '');
  var COLORS = ['var(--pengui)', 'var(--lumos)', 'var(--unicorn)', 'var(--c3)', 'var(--c4)'];
  var STEPS = ['запланирован', 'картинка', 'текст', 'треки', 'сборка', 'вышел'];
  var MONTHS = ['январь', 'февраль', 'март', 'апрель', 'май', 'июнь', 'июль', 'август', 'сентябрь', 'октябрь', 'ноябрь', 'декабрь'];
  var MGEN = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
  var WD = ['пн', 'вт', 'ср', 'чт', 'пт', 'сб', 'вс'];
  var PLANNED = { 'Выбран': 0, 'В работе': 1, 'Вышел': 5 };
  var TODAY = new Date(); TODAY.setHours(0, 0, 0, 0);
  var CH = [], items = [], active = {}, placing = null, choose = null;
  var view = { y: TODAY.getFullYear(), m: TODAY.getMonth() + 1 };
  var sel = { y: view.y, m: view.m, d: TODAY.getDate() };
  var $ = function (id) { return document.getElementById(id); };
  function el(t, c, x) { var e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; }
  function toast(t) { var x = $('toast'); x.textContent = t; x.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(function () { x.classList.remove('on'); }, 2200); }
  function color(k) { var i = CH.findIndex(function (c) { return c.key === k; }); return COLORS[(i < 0 ? 0 : i) % COLORS.length]; }
  function chName(k) { var c = CH.find(function (c) { return c.key === k; }); return c ? c.name : k; }
  function iso(y, m, d) { return y + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0'); }

  function fromRow(r) {
    var m = Number(r.month), d = Number(r.day), y = Number(r.year) || 0;
    if (!y) { y = TODAY.getFullYear(); if (new Date(y, m - 1, d) < new Date(TODAY.getFullYear(), TODAY.getMonth() - 2, 1)) y++; }
    var chs = String(r.channel || '').split(',').map(function (s) { return s.trim(); }).filter(Boolean);
    var rel = String(r.release || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
    var step = r.step !== '' && r.step != null && !isNaN(Number(r.step)) ? Number(r.step) : PLANNED[r.status];
    return { row: r, id: String(r.id), y: y, m: m, d: d, chs: chs, orig: chs.slice(),
      title: String(r.title || ''), ru: String(r.title_ru || ''), note: String(r.note || '').replace(/\n?#+ [^\n]*/g, '').trim(),
      planned: r.status in PLANNED, step: step == null ? 0 : step,
      py: rel ? +rel[1] : y, pm: rel ? +rel[2] : m, pd: rel ? +rel[3] : d };
  }
  function slot(y, m, d, ch) { return items.find(function (it) { return it.planned && it.py === y && it.pm === m && it.pd === d && it.chs[0] === ch; }); }

  var queue = Promise.resolve(), pending = 0;
  function save(it) {
    var r = it.row;
    r.status = it.planned ? (it.step >= 5 ? 'Вышел' : it.step >= 1 ? 'В работе' : 'Выбран') : 'Идея';
    r.step = it.planned ? String(it.step) : '';
    r.release = it.planned ? iso(it.py, it.pm, it.pd) : '';
    r.channel = it.chs.join(', ');
    pending++; $('savest').textContent = '· сохраняю…';
    queue = queue.then(function () {
      return fetch(BASE + '/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ row: r }) })
        .then(function (x) { if (!x.ok) throw new Error(x.status); })
        .catch(function () { toast('Не сохранилось — проверь связь и повтори'); $('savest').textContent = '· ошибка сохранения'; pending = -999; });
    }).then(function () { pending--; if (pending === 0) $('savest').textContent = '· сохранено'; });
  }

  function place(it, s, ch) {
    var other = slot(s.y, s.m, s.d, ch);
    if (other && other !== it) { other.planned = false; other.chs = other.orig.slice(); save(other); }
    var wasPlanned = it.planned;
    it.planned = true; if (!wasPlanned) it.step = 0;
    it.py = s.y; it.pm = s.m; it.pd = s.d;
    it.chs = [ch].concat(it.chs.filter(function (c) { return c !== ch; }));
    save(it);
    toast((other && other !== it ? 'Заменено: ' : 'Поставлено: ') + it.title.slice(0, 40) + ' → ' + s.d + ' ' + MGEN[s.m - 1]);
  }

  function renderChans() {
    var box = $('chans'); box.innerHTML = '';
    CH.forEach(function (c) {
      var b = el('button', 'chip'); b.type = 'button'; b.style.color = color(c.key);
      b.setAttribute('aria-pressed', active[c.key] ? 'true' : 'false');
      var d = el('span', 'dot'); d.style.background = color(c.key); b.appendChild(d); b.appendChild(document.createTextNode(c.name));
      b.onclick = function () { active[c.key] = !active[c.key]; render(); };
      box.appendChild(b);
    });
  }
  function renderGrid() {
    $('mname').textContent = MONTHS[view.m - 1] + ' ' + view.y;
    var g = $('grid'); g.innerHTML = '';
    WD.forEach(function (w) { g.appendChild(el('div', 'wd', w)); });
    var shift = (new Date(view.y, view.m - 1, 1).getDay() + 6) % 7, days = new Date(view.y, view.m, 0).getDate();
    for (var i = 0; i < shift; i++) g.appendChild(el('div', 'day out'));
    for (var d = 1; d <= days; d++) (function (d) {
      var b = el('button', 'day'); b.type = 'button';
      if (view.y === TODAY.getFullYear() && view.m === TODAY.getMonth() + 1 && d === TODAY.getDate()) b.classList.add('today');
      if (sel.y === view.y && sel.m === view.m && sel.d === d) b.classList.add('sel');
      if (placing) b.classList.add('target');
      b.appendChild(el('span', 'n', d));
      CH.forEach(function (c) {
        var p = slot(view.y, view.m, d, c.key);
        if (!p || !active[c.key]) return;
        var pl = el('span', 'pill' + (p.step >= 5 ? ' done' : ''), p.title); pl.style.background = color(c.key); b.appendChild(pl);
      });
      b.setAttribute('aria-label', d + ' ' + MGEN[view.m - 1]);
      b.onclick = function () {
        sel = { y: view.y, m: view.m, d: d };
        if (placing) {
          var opts = (placing.it.chs.length ? placing.it.chs : CH.map(function (c) { return c.key; })).filter(function (c) { return active[c]; });
          if (opts.length === 1) { place(placing.it, sel, opts[0]); placing = null; choose = null; }
          else { choose = { it: placing.it, opts: opts }; placing = null; }
        } else choose = null;
        render();
      };
      g.appendChild(b);
    })(d);
  }
  function renderDay() {
    var c = $('daycard'); c.innerHTML = '';
    c.appendChild(el('h3', 'dayhead', sel.d + ' ' + MGEN[sel.m - 1] + ' ' + sel.y));
    if (choose) {
      var q = el('div', 'slot'); q.appendChild(el('div', 't', 'Для какого канала поставить «' + choose.it.title + '»?'));
      var rw = el('div', 'row');
      choose.opts.forEach(function (k) { var b = el('button', 'chbtn', chName(k)); b.type = 'button'; b.style.background = color(k); b.onclick = function () { place(choose.it, sel, k); choose = null; render(); }; rw.appendChild(b); });
      var no = el('button', '', 'Отмена'); no.type = 'button'; no.onclick = function () { choose = null; render(); }; rw.appendChild(no);
      q.appendChild(rw); c.appendChild(q);
    }
    CH.forEach(function (ch) {
      if (!active[ch.key]) return;
      var p = slot(sel.y, sel.m, sel.d, ch.key);
      var s = el('div', 'slot'); s.style.color = color(ch.key);
      s.appendChild(el('div', 'label', ch.name));
      if (!p) { s.appendChild(el('p', 'empty', 'пусто')); c.appendChild(s); return; }
      var t = el('div', 't', p.title); if (p.ru) { t.appendChild(document.createTextNode(' ')); t.appendChild(el('span', 'ru', '— ' + p.ru)); } s.appendChild(t);
      if (p.d !== p.pd || p.m !== p.pm) s.appendChild(el('div', 'note', 'Повод — ' + p.d + ' ' + MGEN[p.m - 1]));
      if (p.note) s.appendChild(el('div', 'note', p.note));
      var stp = el('div', 'steps');
      STEPS.forEach(function (name, i) {
        var b = el('button', 'step'); b.type = 'button'; b.style.color = color(ch.key);
        b.setAttribute('aria-pressed', i <= p.step ? 'true' : 'false'); b.appendChild(el('span', '', name));
        b.onclick = function () { p.step = i; save(p); render(); };
        stp.appendChild(b);
      });
      s.appendChild(stp);
      var rm = el('button', '', 'Убрать из плана'); rm.type = 'button';
      rm.onclick = function () { p.planned = false; p.chs = p.orig.slice(); save(p); toast('Вернулось в копилку'); render(); };
      var r = el('div', 'row'); r.appendChild(rm); s.appendChild(r);
      c.appendChild(s);
    });
  }
  function renderKop() {
    var box = $('kop'); box.innerHTML = '';
    var list = items.filter(function (it) { return !it.planned && it.row.status !== 'Отклонён' && (!it.chs.length || it.chs.some(function (c) { return active[c]; })); })
      .sort(function (a, b) { return (a.y - b.y) || (a.m - b.m) || (a.d - b.d); });
    var show = list.filter(function (it) { return it.y === view.y && it.m === view.m; });
    $('kcount').textContent = MONTHS[view.m - 1] + ', ' + show.length;
    $('khint').textContent = placing ? 'теперь коснись дня слева' : '';
    $('ghint').textContent = placing ? 'Коснись дня, куда поставить: ' + placing.it.title.slice(0, 50) : '';
    if (!show.length) box.appendChild(el('p', 'empty', 'На этот месяц поводов нет. В боте календаря напиши «собери ' + MONTHS[view.m - 1] + '».'));
    var groups = [];
    show.forEach(function (it) { var g = groups[groups.length - 1]; if (!g || g.d !== it.d) { g = { d: it.d, m: it.m, list: [] }; groups.push(g); } g.list.push(it); });
    groups.forEach(function (g) {
      var sec = el('div', 'dgroup'); sec.appendChild(el('h4', '', g.d + ' ' + MGEN[g.m - 1]));
      g.list.forEach(function (it) {
        var r = el('div', 'idea'), mid = el('div', '');
        var t = el('div', 't', it.title); if (it.ru) { t.appendChild(document.createTextNode(' ')); t.appendChild(el('span', 'ru', '— ' + it.ru)); } mid.appendChild(t);
        r.appendChild(mid);
        var btns = el('div', 'row'); btns.style.flexDirection = 'column'; btns.style.gap = '4px';
        var on = placing && placing.it === it;
        var b = el('button', 'chbtn', on ? 'Отмена' : 'В план'); b.type = 'button'; b.style.background = it.chs.length === 1 ? color(it.chs[0]) : 'var(--accent)';
        b.onclick = function () { placing = on ? null : { it: it }; choose = null; if (placing) toast('Коснись дня слева'); render(); };
        btns.appendChild(b);
        r.appendChild(btns); sec.appendChild(r);
      });
      box.appendChild(sec);
    });
  }
  function render() { renderChans(); renderGrid(); renderDay(); renderKop(); }
  $('prev').onclick = function () { view.m--; if (view.m < 1) { view.m = 12; view.y--; } render(); };
  $('next').onclick = function () { view.m++; if (view.m > 12) { view.m = 1; view.y++; } render(); };

  $('savest').textContent = '· загружаю…';
  fetch(BASE + '/data', { cache: 'no-store' }).then(function (x) { return x.json(); }).then(function (data) {
    CH = (data.channels || []).map(function (c) { return { key: String(c.Channel || '').trim(), name: String(c['Кнопка'] || c.Channel || '').trim() }; }).filter(function (c) { return c.key; });
    if (!CH.length) CH = [{ key: 'pengui', name: 'pengui' }];
    CH.forEach(function (c) { active[c.key] = true; });
    items = (data.rows || []).map(fromRow);
    $('savest').textContent = ''; render();
  }).catch(function () { $('savest').textContent = '· не удалось загрузить таблицу'; });
})();
</script>
</body>
</html>
